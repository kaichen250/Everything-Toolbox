<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新日志 - 万物工具箱</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-container">
        <div class="background-layer current"></div>
        <div class="background-layer next"></div>
    </div>
    <div class="container">
        <header>
            <h1>万物工具箱更新日志</h1>
            <p class="header-subtitle">记录每一次进步，见证每一次成长</p>
        </header>


        <ul class="update-list" id="update-list">
            <!-- 更新日志内容将通过JavaScript从JSON文件动态加载 -->
        </ul>

        <footer>
            <div class="copyright">
                © 2021-2026 万物永存技术工作室 保留所有权利
            </div>
        </footer>
    </div>

    <!-- 返回顶部按钮 -->
    <button class="back-to-top" aria-label="返回顶部">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- 主题切换按钮 -->
    <button class="theme-toggle" aria-label="切换主题">
        <i class="fas fa-moon"></i>
    </button>

    <!-- 音乐播放器按钮 -->
    <button class="music-toggle" id="music-toggle" aria-label="播放音乐">
        <i class="fas fa-music"></i>
    </button>

    <!-- 网易云音乐播放器容器 -->
    <div class="music-player-container" id="music-player-container">
        <div class="music-player-header">
            <span class="music-player-title">背景音乐</span>
            <button class="music-player-close" id="music-player-close" aria-label="关闭播放器">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <iframe 
            id="netease-player"
            frameborder="no" 
            border="0" 
            marginwidth="0" 
            marginheight="0" 
            width="310" 
            height="90"
            src="">
        </iframe>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>

</body></html>
